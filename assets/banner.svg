<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 220" width="100%" height="220" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a12" />
      <stop offset="50%" stop-color="#0c1220" />
      <stop offset="100%" stop-color="#141c2e" />
    </linearGradient>
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>
    <linearGradient id="orbit-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.95" />
      <stop offset="70%" stop-color="#38bdf8" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.05" />
    </linearGradient>
    <linearGradient id="ascent-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.1" />
      <stop offset="60%" stop-color="#f59e0b" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.9" />
    </linearGradient>
    <pattern id="telemetry-grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#94a3b8" stroke-width="0.5" stroke-opacity="0.06" />
      <circle cx="0" cy="0" r="0.75" fill="#f59e0b" fill-opacity="0.15" />
    </pattern>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base & Grid -->
  <rect width="940" height="220" rx="8" fill="url(#bg-grad)" />
  <rect width="940" height="220" rx="8" fill="url(#telemetry-grid)" />
  <rect x="1" y="1" width="938" height="218" rx="7" fill="none" stroke="#26354d" stroke-width="1.2" />

  <!-- Corner Avionics Brackets -->
  <path d="M 14 32 L 14 14 L 32 14" fill="none" stroke="#f59e0b" stroke-width="2.5" />
  <path d="M 926 32 L 926 14 L 908 14" fill="none" stroke="#f59e0b" stroke-width="2.5" />
  <path d="M 14 188 L 14 206 L 32 206" fill="none" stroke="#f59e0b" stroke-width="2.5" />
  <path d="M 926 188 L 926 206 L 908 206" fill="none" stroke="#f59e0b" stroke-width="2.5" />

  <!-- Background Ascent Trajectory Arc -->
  <path d="M 180 215 C 320 200, 480 160, 680 95" fill="none" stroke="url(#ascent-grad)" stroke-width="1.5" stroke-dasharray="3 4" opacity="0.6" />

  <!-- Right Section: Astrodynamics & Telemetry Box -->
  <g transform="translate(680, 110)">
    <!-- Radar Polar Rings -->
    <circle cx="0" cy="0" r="68" fill="none" stroke="#26354d" stroke-width="0.75" stroke-dasharray="2 3" opacity="0.4" />
    <circle cx="0" cy="0" r="46" fill="none" stroke="#26354d" stroke-width="0.75" opacity="0.5" />
    <circle cx="0" cy="0" r="24" fill="#0d1424" stroke="#38bdf8" stroke-width="1.2" />
    <circle cx="0" cy="0" r="6" fill="#f59e0b" filter="url(#glow)" />

    <!-- Radar Crosshairs -->
    <line x1="-75" y1="0" x2="75" y2="0" stroke="#334155" stroke-width="0.75" stroke-dasharray="3 3" opacity="0.4" />
    <line x1="0" y1="-75" x2="0" y2="75" stroke="#334155" stroke-width="0.75" stroke-dasharray="3 3" opacity="0.4" />

    <!-- Orbital Trajectory Ellipse -->
    <ellipse cx="14" cy="-2" rx="82" ry="46" fill="none" stroke="url(#orbit-grad)" stroke-width="1.8" transform="rotate(-15)" />
    
    <!-- Periapsis (Rp) Point -->
    <circle cx="-62" cy="18" r="3" fill="#38bdf8" />
    <text x="-68" y="30" fill="#94a3b8" font-family="'SF Mono', Consolas, monospace" font-size="8" text-anchor="end">PERIAPSIS: 185 km</text>
    
    <!-- Apoapsis (Ra) Point -->
    <circle cx="88" cy="-22" r="3.5" fill="#f59e0b" filter="url(#glow)" />
    <text x="94" y="-28" fill="#fbbf24" font-family="'SF Mono', Consolas, monospace" font-size="8.5" font-weight="bold">APOAPSIS: 412 km</text>
    
    <!-- Tangential Velocity Vector -->
    <line x1="88" y1="-22" x2="114" y2="-38" stroke="#f59e0b" stroke-width="1.5" />
    <polygon points="114,-38 106,-33 108,-41" fill="#f59e0b" />
    <text x="118" y="-40" fill="#f59e0b" font-family="'SF Mono', Consolas, monospace" font-size="7.5" font-weight="bold">v = 7,784 m/s</text>
  </g>

  <!-- Far Right: Telemetry Mission Status Box -->
  <g transform="translate(805, 48)">
    <rect x="0" y="0" width="105" height="124" rx="4" fill="#080c14" stroke="#1e293b" stroke-width="1" />
    <text x="8" y="16" fill="#f59e0b" font-family="'SF Mono', Consolas, monospace" font-size="7.5" font-weight="bold">TELEMETRY // LEO</text>
    <line x1="8" y1="22" x2="97" y2="22" stroke="#1e293b" stroke-width="1" />
    <text x="8" y="36" fill="#64748b" font-family="'SF Mono', Consolas, monospace" font-size="7">MACH</text>
    <text x="8" y="47" fill="#f8fafc" font-family="'SF Mono', Consolas, monospace" font-size="9" font-weight="bold">25.12</text>
    <text x="8" y="61" fill="#64748b" font-family="'SF Mono', Consolas, monospace" font-size="7">ALTITUDE</text>
    <text x="8" y="72" fill="#f8fafc" font-family="'SF Mono', Consolas, monospace" font-size="9" font-weight="bold">412.8 km</text>
    <text x="8" y="86" fill="#64748b" font-family="'SF Mono', Consolas, monospace" font-size="7">INCLINATION</text>
    <text x="8" y="97" fill="#f8fafc" font-family="'SF Mono', Consolas, monospace" font-size="9" font-weight="bold">28.50°</text>
    <text x="8" y="112" fill="#10b981" font-family="'SF Mono', Consolas, monospace" font-size="7.5" font-weight="bold">● NOMINAL</text>
  </g>

  <!-- Left Side: Technical Data & Typography -->
  <g transform="translate(48, 48)">
    <circle cx="0" cy="-4" r="3.5" fill="#10b981" filter="url(#glow)" />
    <text x="12" y="0" fill="#f59e0b" font-family="'SF Mono', Consolas, 'Courier New', monospace" font-size="10.5" font-weight="bold" letter-spacing="3">AEROSPACE SYSTEMS ENGINEERING LABORATORY</text>
    <text x="390" y="0" fill="#64748b" font-family="'SF Mono', Consolas, monospace" font-size="9.5">// KSC PAD 39A • 28.5721° N, 80.6480° W</text>
  </g>

  <!-- Name Title -->
  <text x="48" y="105" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, sans-serif" font-size="48" font-weight="800" letter-spacing="1.5">VALLIENTE</text>

  <!-- Primary Subtitle -->
  <text x="50" y="136" fill="#cbd5e1" font-family="'SF Mono', Consolas, 'Courier New', monospace" font-size="13" font-weight="600" letter-spacing="2">FLIGHT DYNAMICS  •  PROPULSION SYSTEMS  •  ORBITAL MECHANICS</text>

  <!-- Technical Spec Footer Pill -->
  <g transform="translate(48, 156)">
    <rect x="0" y="0" width="575" height="26" rx="4" fill="#090e1a" stroke="#1e293b" stroke-width="1" />
    <text x="14" y="17" fill="#94a3b8" font-family="'SF Mono', Consolas, monospace" font-size="9.5" letter-spacing="0.5">MISSION ARCHITECTURE: 6-DoF RK4/RKF45 • POWERED EXPLICIT GUIDANCE (PEG) • CR3BP ASTRODYNAMICS</text>
  </g>
</svg>